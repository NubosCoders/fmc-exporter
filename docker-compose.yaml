services:
  fmc-collector:
    build:
      context: .
    environment:
      FMC_URL: ${FMC_URL}
      FMC_USER: ${FMC_USER}
      FMC_PASSWORD: ${FMC_PASSWORD}
      FMC_CA_BUNDLE: ${FMC_CA_BUNDLE:-}
      FMC_TLS_VERIFY: ${FMC_TLS_VERIFY:-true}
      FMC_TLS_VERIFY_HOSTNAME: ${FMC_TLS_VERIFY_HOSTNAME:-true}
      FMC_TRUST_ENV: ${FMC_TRUST_ENV:-false}
      HTTP_PORT: ${HTTP_PORT:-8080}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-60}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-5}
      READ_TIMEOUT: ${READ_TIMEOUT:-30}
      OUTPUT_FILE: ${OUTPUT_FILE:-}
    ports:
      - "${EXPORTER_PORT:-8081}:${HTTP_PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - "http://127.0.0.1:${HTTP_PORT:-8080}/health"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      monitoring:
        aliases:
          - fmc-exporter
    restart: unless-stopped


networks:
  monitoring:
    external: true
    name: monitoring