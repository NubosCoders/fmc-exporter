services:
  postgres-server:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zabbix-net]
    restart: always

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.4-latest
    ports: ["10051:10051"]
    environment:
      DB_SERVER_HOST: postgres-server
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      postgres-server:
        condition: service_healthy
    networks: [zabbix-net]
    restart: always

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.4-latest
    ports: ["8080:8080"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres-server
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PHP_TZ: ${PHP_TZ:-UTC}
    depends_on:
      postgres-server:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks: [zabbix-net]
    restart: always

  fmc-collector:
    build:
      context: ..
    environment:
      FMC_URL: ${FMC_URL}
      FMC_USER: ${FMC_USER}
      FMC_PASSWORD: ${FMC_PASSWORD}
      FMC_CA_BUNDLE: ${FMC_CA_BUNDLE:-}
      HTTP_PORT: ${HTTP_PORT:-8080}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-60}
    networks: [zabbix-net]
    restart: unless-stopped

volumes:
  pg_data:

networks:
  zabbix-net:
    driver: bridge
